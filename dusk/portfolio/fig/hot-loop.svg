><text x="218" y="470" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="400" fill="#0A6CFF" text-anchor="start" letter-spacing="0.6">C IN → HS → LS</text><text x="218" y="492" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="400" fill="#0A6CFF" text-anchor="start" letter-spacing="0.6">→ GND → C IN</text><text x="218" y="514" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="400" fill="#0A6CFF" text-anchor="start" letter-spacing="0.6">keep it small</text><text x="60" y="744" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="400" fill="#5B6470" text-anchor="start" letter-spacing="0.6">Original drawing, after TI SNVA803</text>
