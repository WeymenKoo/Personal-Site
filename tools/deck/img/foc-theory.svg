th d="M210 190 L210 196" stroke="#111111" stroke-width="1.2" fill="none"/><circle cx="210" cy="123" r="2.5" fill="#111111"/><text x="226" y="119" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#7A7A7A" text-anchor="start" font-weight="400">B</text><text x="218" y="193" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#E4561B" text-anchor="start" font-weight="400">ib</text><path d="M310 50 L310 75" stroke="#111111" stroke-width="1.2" fill="none"/><rect x="298" y="75" width="24" height="30" fill="#fff" stroke="#111111" stroke-width="1.2"/><path d="M310 105 L310 140" stroke="#111111" stroke-width="1.2" fill="none"/><rect x="298" y="140" width="24" height="30" fill="#fff" stroke="#111111" stroke-width="1.2"/><path d="M310 170 L310 180" stroke="#111111" stroke-width="1.2" fill="none"/><rect x="304" y="180" width="12" height="10" fill="#fff" stroke="#111111" stroke-width="1"/><path d="M310 190 L310 196" stroke="#111111" stroke-width="1.2" fill="none"/><circle cx="310" cy="123" r="2.5" fill="#111111"/><text x="326" y="119" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#7A7A7A" text-anchor="start" font-weight="400">C</text><text x="318" y="193" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#E4561B" text-anchor="start" font-weight="400">ic</text><circle cx="455" cy="123" r="34" fill="#fff" stroke="#111111" stroke-width="1.2"/><text x="455" y="120" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#111111" text-anchor="middle" font-weight="600">PMSM</text><text x="455" y="136" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#7A7A7A" text-anchor="middle" font-weight="400">14 pole pairs</text><path d="M110 123 L390 100" stroke="#CFCFCF" stroke-width="1.2" fill="none"/><path d="M390 100 L422 110" stroke="#CFCFCF" stroke-width="1.2" fill="none"/><path d="M210 123 L390 123" stroke="#CFCFCF" stroke-width="1.2" fill="none"/><path d="M390 123 L422 120" stroke="#CFCFCF" stroke-width="1.2" fill="none"/><path d="M310 123 L390 146" stroke="#CFCFCF" stroke-width="1.2" fill="none"/><path d="M390 146 L422 130" stroke="#CFCFCF" stroke-width="1.2" fill="none"/><text x="455" y="175" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#7A7A7A" text-anchor="middle" font-weight="400">θ from an absolute encoder</text><text x="455" y="190" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#7A7A7A" text-anchor="middle" font-weight="400">on the rotor axis</text><text x="0" y="223" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#7A7A7A" text-anchor="start" font-weight="400">Six gates, 25 kHz · dead time 200 ns · three low-side shunts sampled at the PWM centre, when all low sides conduct</text><text x="620" y="18" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#7A7A7A" text-anchor="start" font-weight="400">ROTOR FRAME</text><circle cx="760" cy="120" r="60" fill="none" stroke="#CFCFCF" stroke-width="1"/><path d="M760 120 L845 80" stroke="#111111" stroke-width="1.2" fill="none" marker-end="url(#a)"/><text x="850" y="78" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111111" text-anchor="start" font-weight="400">d  (magnet axis, i_d = 0)</text><path d="M760 120 L800 35" stroke="#E4561B" stroke-width="1.2" fill="none" marker-end="url(#ao)"/><text x="804" y="28" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#E4561B" text-anchor="start" font-weight="600">q  (torque: T = Kt · i_q)</text><path d="M760 120 L855 120" stroke="#7A7A7A" stroke-width="1.2" fill="none" marker-end="url(#a)"/><text x="858" y="134" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#7A7A7A" text-anchor="start" font-weight="400">stator α</text><path d="M800 120 A40 40 0 0 0 796 103" fill="none" stroke="#7A7A7A" stroke-width="1"/><text x="806" y="106" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#7A7A7A" text-anchor="start" font-weight="400">θ</text><text x="620" y="215" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#7A7A7A" text-anchor="start" font-weight="400">In the rotor frame the currents are DC, so two PI loops do the work.</text><text x="620" y="231" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#7A7A7A" text-anchor="start" font-weight="400">That is the whole trick; six-step gives ~13 % torque ripple and no angle control.</text><text x="0" y="270" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#7A7A7A" text-anchor="start" font-weight="400">CONTROL LOOP · EVERY 40 µs</text><rect x="130" y="290" width="118" height="56" fill="#fff" stroke="#111111" stroke-width="1.2"/><text x="189" y="314" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#111111" text-anchor="middle" font-weight="600">Clarke</text><text x="189" y="332" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#7A7A7A" text-anchor="middle" font-weight="400">3 → 2 phases</text><path d="M248 318 L282 318" stroke="#111111" stroke-width="1.2" fill="none" marker-end="url(#a)"/><rect x="282" y="290" width="118" height="56" fill="#fff" stroke="#111111" stroke-width="1.2"/><text x="341" y="314" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#111111" text-anchor="middle" font-weight="600">Park</text><text x="341" y="332" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#7A7A7A" text-anchor="middle" font-weight="400">with θ</text><path d="M400 318 L434 318" stroke="#111111" stroke-width="1.2" fill="none" marker-end="url(#a)"/><rect x="434" y="290" width="118" height="56" fill="#fff" stroke="#E4561B" stroke-width="1.6"/><text x="493" y="314" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#111111" text-anchor="middle" font-weight="600">PI × 2</text><text x="493" y="332" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#7A7A7A" text-anchor="middle" font-weight="400">i_d → 0, i_q → T*</text><path d="M552 318 L586 318" stroke="#111111" stroke-width="1.2" fill="none" marker-end="url(#a)"/><rect x="586" y="290" width="118" height="56" fill="#fff" stroke="#111111" stroke-width="1.2"/><text x="645" y="314" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#111111" text-anchor="middle" font-weight="600">Inverse Park</text><text x="645" y="332" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#7A7A7A" text-anchor="middle" font-weight="400">with θ</text><path d="M704 318 L738 318" stroke="#111111" stroke-width="1.2" fill="none" marker-end="url(#a)"/><rect x="738" y="290" width="118" height="56" fill="#fff" stroke="#111111" stroke-width="1.2"/><text x="797" y="314" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#111111" text-anchor="middle" font-weight="600">SVPWM</text><text x="797" y="332" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#7A7A7A" text-anchor="middle" font-weight="400">+15 % bus use</text><path d="M856 318 L890 318" stroke="#111111" stroke-width="1.2" fill="none" marker-end="url(#a)"/><rect x="890" y="290" width="118" height="56" fill="#fff" stroke="#111111" stroke-width="1.2"/><text x="949" y="314" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#111111" text-anchor="middle" font-weight="600">Gates</text><text x="949" y="332" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#7A7A7A" text-anchor="middle" font-weight="400">TIM1 · DRV8323</text><path d="M20 318 L130 318" stroke="#E4561B" stroke-width="1.2" fill="none" marker-end="url(#ao)"/><text x="20" y="310" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#E4561B" text-anchor="start" font-weight="400">ia ib ic</text><path d="M1008 318 L1032 318 L1032 244 L220 244 L220 215" stroke="#CFCFCF" stroke-width="1.2" fill="none" stroke-dasharray="4 4"/><text x="226" y="238" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#7A7A7A" text-anchor="start" font-weight="400">gate signals back to the bridge</text><path d="M341 386 L645 386" stroke="#7A7A7A" stroke-width="1.2" fill="none"/><path d="M341 386 L341 346" stroke="#7A7A7A" stroke-width="1.2" fill="none" marker-end="url(#a)"/><path d="M645 386 L645 346" stroke="#7A7A7A" stroke-width="1.2" fill="none" marker-end="url(#a)"/><text x="493" y="402" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#7A7A7A" text-anchor="middle" font-weight="400">θ, encoder · 14-bit</text><path d="M493 260 L493 290" stroke="#E4561B" stroke-width="1.2" fill="none" marker-end="url(#ao)"/><text x="499" y="268" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#E4561B" text-anchor="start" font-weight="400">i_q* from the host</text></svg>